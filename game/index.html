<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ORBITAL SALVAGE</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #04060e; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="ORBITAL SALVAGE: pilot a salvage tug, reel glowing cargo pods into your hold with the tractor beam, and dock at the station to refuel before the debris field burns up"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/game.js"></script>
</body>
</html>
